<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日銀統計ZIP グラフビューア</title>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <style>
      :root {
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        color: #14213d;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #f3f7ff;
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 10px 28px rgba(20, 33, 61, 0.1);
      }
      h1 {
        margin-top: 0;
      }
      .controls {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        margin-bottom: 16px;
      }
      .block {
        border: 1px solid #dbe4ff;
        border-radius: 10px;
        padding: 10px;
        background: #f8faff;
      }
      label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 4px;
      }
      select,
      button,
      input[type="text"],
      input[type="file"] {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #c6d4ff;
        box-sizing: border-box;
      }
      button {
        background: #2d6cff;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.92;
      }
      #status {
        margin: 6px 0 14px;
        min-height: 1.4em;
        color: #1e3a8a;
      }
      canvas {
        max-height: 520px;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>日銀統計 ZIP → 系列選択グラフ</h1>
      <p>
        指定ZIP（既定：
        <code>cgpi_m_jp.zip</code>
        ）からExcelを読み込み、任意のデータ系列をプルダウンで選んで線グラフを描画します。
      </p>

      <div class="controls">
        <div class="block">
          <label for="zipUrl">ZIP URL</label>
          <input id="zipUrl" type="text" value="https://www.stat-search.boj.or.jp/info/cgpi_m_jp.zip" />
          <button id="loadRemoteBtn" style="margin-top: 8px">URLから読み込む</button>
        </div>

        <div class="block">
          <label for="zipFile">ZIPファイルをローカル選択（CORS回避用）</label>
          <input id="zipFile" type="file" accept=".zip" />
        </div>

        <div class="block">
          <label for="sheetSelect">シート</label>
          <select id="sheetSelect" disabled></select>
        </div>

        <div class="block">
          <label for="seriesSelect">データ系列（列）</label>
          <select id="seriesSelect" disabled></select>
        </div>
      </div>

      <div id="status">ZIPを読み込んでください。</div>
      <canvas id="lineChart" aria-label="系列の線グラフ"></canvas>
    </main>

    <script>
      const state = {
        workbook: null,
        chart: null,
      };

      const zipUrlInput = document.getElementById("zipUrl");
      const loadRemoteBtn = document.getElementById("loadRemoteBtn");
      const zipFileInput = document.getElementById("zipFile");
      const sheetSelect = document.getElementById("sheetSelect");
      const seriesSelect = document.getElementById("seriesSelect");
      const statusEl = document.getElementById("status");
      const chartCanvas = document.getElementById("lineChart");

      function setStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.style.color = isError ? "#b42318" : "#1e3a8a";
      }

      async function extractWorkbookFromZipBuffer(zipBuffer) {
        const zip = await JSZip.loadAsync(zipBuffer);
        const excelEntry = Object.values(zip.files).find((f) => {
          const lower = f.name.toLowerCase();
          return !f.dir && (lower.endsWith(".xlsx") || lower.endsWith(".xls"));
        });

        if (!excelEntry) {
          throw new Error("ZIP内にExcelファイル（.xlsx/.xls）が見つかりませんでした。");
        }

        const excelBuffer = await excelEntry.async("arraybuffer");
        return XLSX.read(excelBuffer, { type: "array" });
      }

      function getSheetRows(sheetName) {
        const ws = state.workbook.Sheets[sheetName];
        return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
      }

      function fillSheetSelect() {
        sheetSelect.innerHTML = "";
        for (const name of state.workbook.SheetNames) {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          sheetSelect.appendChild(opt);
        }
        sheetSelect.disabled = false;
      }

      function inferHeaderAndDateColumn(rows) {
        const maxCols = Math.max(...rows.slice(0, 20).map((r) => r.length), 0);
        let headerRowIndex = 0;
        let dateColIndex = 0;
        let bestScore = -Infinity;

        for (let r = 0; r < Math.min(20, rows.length); r++) {
          const row = rows[r];
          let score = 0;
          for (let c = 0; c < maxCols; c++) {
            if (typeof row[c] === "string" && row[c].trim()) score += 1;
          }
          if (score > bestScore) {
            bestScore = score;
            headerRowIndex = r;
          }
        }

        const headers = rows[headerRowIndex] || [];
        const lowerHeaders = headers.map((h) => String(h ?? "").toLowerCase());
        const maybeDateIdx = lowerHeaders.findIndex((h) =>
          ["date", "年月", "時点", "year", "month", "period"].some((k) => h.includes(k)),
        );
        if (maybeDateIdx >= 0) dateColIndex = maybeDateIdx;

        return { headerRowIndex, dateColIndex };
      }

      function fillSeriesSelect() {
        const rows = getSheetRows(sheetSelect.value);
        if (!rows.length) {
          seriesSelect.disabled = true;
          return;
        }

        const { headerRowIndex, dateColIndex } = inferHeaderAndDateColumn(rows);
        const headers = rows[headerRowIndex] || [];
        seriesSelect.innerHTML = "";

        headers.forEach((h, idx) => {
          if (idx === dateColIndex) return;
          const name = String(h ?? "").trim() || `列${idx + 1}`;
          const opt = document.createElement("option");
          opt.value = String(idx);
          opt.dataset.headerRowIndex = String(headerRowIndex);
          opt.dataset.dateColIndex = String(dateColIndex);
          opt.textContent = `${name} (col ${idx + 1})`;
          seriesSelect.appendChild(opt);
        });

        seriesSelect.disabled = seriesSelect.options.length === 0;
        if (!seriesSelect.disabled) drawSeries();
      }

      function normalizeLabel(v) {
        if (v == null) return "";
        if (typeof v === "number" && v > 20000 && v < 70000) {
          const d = XLSX.SSF.parse_date_code(v);
          if (d) return `${d.y}-${String(d.m).padStart(2, "0")}`;
        }
        return String(v);
      }

      function drawSeries() {
        const rows = getSheetRows(sheetSelect.value);
        const selected = seriesSelect.selectedOptions[0];
        if (!selected) return;

        const seriesCol = Number(selected.value);
        const headerRowIndex = Number(selected.dataset.headerRowIndex);
        const dateColIndex = Number(selected.dataset.dateColIndex);
        const dataRows = rows.slice(headerRowIndex + 1);

        const labels = [];
        const values = [];
        for (const row of dataRows) {
          const y = row[seriesCol];
          if (y == null || y === "" || Number.isNaN(Number(y))) continue;
          labels.push(normalizeLabel(row[dateColIndex]));
          values.push(Number(y));
        }

        if (state.chart) state.chart.destroy();

        state.chart = new Chart(chartCanvas, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: selected.textContent,
                data: values,
                borderColor: "#2d6cff",
                backgroundColor: "rgba(45,108,255,0.15)",
                pointRadius: 1,
                tension: 0.15,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: { ticks: { maxTicksLimit: 12 } },
            },
          },
        });

        setStatus(`描画完了: ${selected.textContent}（${values.length}点）`);
      }

      async function loadZipBuffer(zipBuffer) {
        setStatus("ZIPを解析中...");
        state.workbook = await extractWorkbookFromZipBuffer(zipBuffer);
        fillSheetSelect();
        fillSeriesSelect();
        setStatus("読み込み成功。シート・系列を選択できます。");
      }

      loadRemoteBtn.addEventListener("click", async () => {
        const url = zipUrlInput.value.trim();
        if (!url) return;
        try {
          setStatus("URLからZIPをダウンロード中...");
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const buffer = await response.arrayBuffer();
          await loadZipBuffer(buffer);
        } catch (err) {
          setStatus(
            `URL読み込みに失敗しました（${err.message}）。CORS制限の可能性があるため、ZIPファイル選択をお試しください。`,
            true,
          );
        }
      });

      zipFileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const buffer = await file.arrayBuffer();
          await loadZipBuffer(buffer);
        } catch (err) {
          setStatus(`ローカルZIPの読み込みに失敗しました: ${err.message}`, true);
        }
      });

      sheetSelect.addEventListener("change", fillSeriesSelect);
      seriesSelect.addEventListener("change", drawSeries);
    </script>
  </body>
</html>
