<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日銀統計ZIP CSV グラフビューア</title>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <style>
      :root {
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        color: #14213d;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #f3f7ff;
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 10px 28px rgba(20, 33, 61, 0.1);
      }
      .controls {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }
      .block {
        border: 1px solid #dbe4ff;
        border-radius: 10px;
        padding: 10px;
        background: #f8faff;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-size: 0.9rem;
      }
      input,
      select,
      button {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #c6d4ff;
        box-sizing: border-box;
      }
      button {
        background: #2d6cff;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      #status {
        margin: 12px 0;
        min-height: 1.4em;
        color: #1e3a8a;
      }
      .chart-wrap {
        height: 520px;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>日銀統計 ZIP（CSV）→ 系列選択グラフ</h1>
      <p>
        ZIP 内の <strong>CSV</strong> を読み込みます。<strong>1行目を年月（横軸）</strong>、
        <strong>2行目以降をデータ系列（縦方向）</strong>として扱い、選択した系列を線グラフ化します。
      </p>

      <div class="controls">
        <div class="block">
          <label for="zipUrl">ZIP URL</label>
          <input id="zipUrl" type="text" value="https://www.stat-search.boj.or.jp/info/cgpi_m_jp.zip" />
          <button id="loadRemoteBtn" style="margin-top: 8px">URLから読み込む</button>
        </div>

        <div class="block">
          <label for="zipFile">ZIPファイルをローカル選択（CORS回避）</label>
          <input id="zipFile" type="file" accept=".zip" />
        </div>

        <div class="block">
          <label for="csvSelect">CSVファイル</label>
          <select id="csvSelect" disabled></select>
        </div>

        <div class="block">
          <label for="seriesSelect">データ系列（行）</label>
          <select id="seriesSelect" disabled></select>
        </div>
      </div>

      <div id="status">ZIPを読み込んでください。</div>
      <div class="chart-wrap">
        <canvas id="lineChart" aria-label="系列の線グラフ"></canvas>
      </div>
    </main>

    <script>
      const state = {
        csvRowsMap: new Map(),
        chart: null,
      };

      const zipUrlInput = document.getElementById("zipUrl");
      const loadRemoteBtn = document.getElementById("loadRemoteBtn");
      const zipFileInput = document.getElementById("zipFile");
      const csvSelect = document.getElementById("csvSelect");
      const seriesSelect = document.getElementById("seriesSelect");
      const statusEl = document.getElementById("status");
      const chartCanvas = document.getElementById("lineChart");

      function setStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.style.color = isError ? "#b42318" : "#1e3a8a";
      }

      function decodeCsvText(csvBuffer) {
        const utf8 = new TextDecoder("utf-8", { fatal: false }).decode(csvBuffer);
        if (!utf8.includes("�")) {
          return utf8;
        }
        return new TextDecoder("shift_jis", { fatal: false }).decode(csvBuffer);
      }

      async function parseCsvFromZip(zipBuffer) {
        const zip = await JSZip.loadAsync(zipBuffer);
        const csvEntries = Object.values(zip.files)
          .filter((f) => !f.dir && f.name.toLowerCase().endsWith(".csv"))
          .sort((a, b) => a.name.localeCompare(b.name));

        if (csvEntries.length === 0) {
          throw new Error("ZIP内にCSVファイル（.csv）が見つかりませんでした。");
        }

        state.csvRowsMap.clear();
        for (const entry of csvEntries) {
          const csvBuffer = await entry.async("arraybuffer");
          const csvText = decodeCsvText(csvBuffer);
          const parsed = Papa.parse(csvText, { skipEmptyLines: true });
          state.csvRowsMap.set(entry.name, parsed.data);
        }

        return csvEntries.map((entry) => entry.name);
      }

      function fillCsvSelect(csvNames) {
        csvSelect.innerHTML = "";
        for (const name of csvNames) {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          csvSelect.appendChild(opt);
        }
        csvSelect.disabled = false;
      }

      function fillSeriesSelect() {
        const rows = state.csvRowsMap.get(csvSelect.value) || [];
        seriesSelect.innerHTML = "";
        if (rows.length < 2) {
          seriesSelect.disabled = true;
          return;
        }

        rows.forEach((row, rowIndex) => {
          if (rowIndex === 0) return;
          const label = String(row[0] ?? "").trim() || `系列${rowIndex}`;
          const opt = document.createElement("option");
          opt.value = String(rowIndex);
          opt.textContent = `${label} (row ${rowIndex + 1})`;
          seriesSelect.appendChild(opt);
        });

        seriesSelect.disabled = seriesSelect.options.length === 0;
        if (!seriesSelect.disabled) drawSeries();
      }

      function drawSeries() {
        const rows = state.csvRowsMap.get(csvSelect.value) || [];
        const selected = seriesSelect.selectedOptions[0];
        if (!selected || rows.length < 2) return;

        const seriesRowIndex = Number(selected.value);
        const headerRow = rows[0] || [];
        const seriesRow = rows[seriesRowIndex] || [];

        const labels = [];
        const values = [];

        for (let col = 1; col < headerRow.length; col++) {
          const x = String(headerRow[col] ?? "").trim();
          const yRaw = String(seriesRow[col] ?? "").trim().replace(/,/g, "");
          const yNum = Number(yRaw);
          if (!x || yRaw === "" || Number.isNaN(yNum)) continue;
          labels.push(x);
          values.push(yNum);
        }

        if (state.chart) state.chart.destroy();
        state.chart = new Chart(chartCanvas, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: `${csvSelect.value} / ${selected.textContent}`,
                data: values,
                borderColor: "#2d6cff",
                backgroundColor: "rgba(45,108,255,0.15)",
                pointRadius: 1,
                tension: 0.15,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { x: { ticks: { maxTicksLimit: 12 } } },
          },
        });

        setStatus(`描画完了: ${selected.textContent}（${values.length}点）`);
      }

      async function loadZipBuffer(zipBuffer) {
        setStatus("ZIPを解析中...");
        const csvNames = await parseCsvFromZip(zipBuffer);
        fillCsvSelect(csvNames);
        fillSeriesSelect();
        setStatus(`読み込み成功: CSV ${csvNames.length}件`);
      }

      loadRemoteBtn.addEventListener("click", async () => {
        const url = zipUrlInput.value.trim();
        if (!url) return;
        try {
          setStatus("URLからZIPをダウンロード中...");
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const buffer = await response.arrayBuffer();
          await loadZipBuffer(buffer);
        } catch (err) {
          setStatus(
            `URL読み込みに失敗しました（${err.message}）。CORS制限の可能性があるため、ZIPファイル選択をお試しください。`,
            true,
          );
        }
      });

      zipFileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const buffer = await file.arrayBuffer();
          await loadZipBuffer(buffer);
        } catch (err) {
          setStatus(`ローカルZIPの読み込みに失敗しました: ${err.message}`, true);
        }
      });

      csvSelect.addEventListener("change", fillSeriesSelect);
      seriesSelect.addEventListener("change", drawSeries);
    </script>
  </body>
</html>
